name = "portfoliosite"
compatibility_date = "2026-08-30"
main = "./worker.ts"

# カスタムドメイン（DNS が Cloudflare を向いている必要あり）
# www は Worker で apex へ 301 するため、両方のホストを受け付ける
[[routes]]
pattern = "sakatwun.com"
custom_domain = true

[[routes]]
pattern = "www.sakatwun.com"
custom_domain = true

# Next.js static export (out/) を Workers Static Assets として配信
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# Next trailingSlash に合わせる。スラッシュ正規化の301は worker.ts 側で先に行う
html_handling = "force-trailing-slash"
# www / http / trailing-slash 正規化のため、アセット配信より先に Worker を実行する
run_worker_first = true
